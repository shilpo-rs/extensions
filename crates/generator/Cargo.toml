[package]
name = "shilpo-registry-generator"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
name = "shilpo_registry_generator"
path = "src/lib.rs"

[[bin]]
name = "shilpo-registry-generator"
path = "src/main.rs"

[dependencies]
shilpo-registry-contract = { git = "https://github.com/shilpo-rs/shilpo", rev = "cf284bb1dff6f3cbf8a628c9ba140da8358025fa" }
shilpo-ext-api = { git = "https://github.com/shilpo-rs/shilpo", rev = "cf284bb1dff6f3cbf8a628c9ba140da8358025fa" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
schemars = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
