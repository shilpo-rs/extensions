# cargo-deny config. `bans`/`licenses`/`sources` gate every PR via ci.yml (deterministic function of
# Cargo.lock); `advisories` runs on a schedule via audit.yml (depends on a mutable external database, so
# a newly published CVE opens a tracking issue instead of reddening unrelated PRs).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = [
    # niri-ipc is GPL-3.0-or-later; required for Niri compositor IPC integration in desktop/services
    { allow = ["GPL-3.0-or-later"], crate = "niri-ipc" },
]

# tree-sitter-graphql has no license field in Cargo.toml; its vendored LICENSE file is MIT
[[licenses.clarify]]
crate = "tree-sitter-graphql"
expression = "MIT"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
