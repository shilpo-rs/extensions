name: Publish

on:
  workflow_run:
    workflows: ["Main Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-registry
  cancel-in-progress: false

jobs:
  publish-releases:
    name: Sign & Publish Releases
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: registry-dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify build provenance
        run: |
          PROV_SHA=$(jq -r '.commit_sha' dist/provenance.json)
          EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"
          if [ "$PROV_SHA" != "$EXPECTED_SHA" ]; then
            echo "Provenance mismatch! Expected $EXPECTED_SHA, got $PROV_SHA"
            exit 1
          fi
          echo "Provenance verified for commit $PROV_SHA"

      - name: Sign packages and index
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          cargo run --manifest-path crates/generator/Cargo.toml -- sign \
            --unsigned-index dist/unsigned-index.json \
            --dist-dir dist \
            --output index.json

      - name: Upload GitHub Releases for new extension versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -c '.index.releases[]' index.json | while read -r rel; do
            ID=$(echo "$rel" | jq -r '.id')
            VER=$(echo "$rel" | jq -r '.version')
            TAG="${ID}-v${VER}"
            PKG="dist/${ID}-${VER}.shilpo-ext"
            SIG="dist/${ID}-${VER}.shilpo-ext.sig.json"
            if [ -f "$PKG" ]; then
              if ! gh release view "$TAG" >/dev/null 2>&1; then
                echo "Creating GitHub Release $TAG..."
                gh release create "$TAG" "$PKG" "$SIG" \
                  --title "$TAG" \
                  --notes "Automated release of $ID v$VER" \
                  --target main
              else
                echo "Release $TAG already exists, skipping upload."
              fi
            fi
          done

      - name: Commit and push signed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json schema/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update registry index [skip ci]"
            git push origin main
          else
            echo "No index changes to commit."
          fi
