name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extensions (wasm32-wasip2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Build all extensions
        run: cargo build --workspace --target wasm32-wasip2 --release

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain --untracked-files=all)"
