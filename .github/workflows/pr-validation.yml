name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-metadata:
    name: Validate Manifests & Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-wasip2

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run generator unit & integration tests
        run: cargo test --manifest-path crates/generator/Cargo.toml

      - name: Validate extensions & check capability diffs
        run: |
          cargo run --manifest-path crates/generator/Cargo.toml -- validate \
            --pr-author "${{ github.event.pull_request.user.login }}" \
            --schema-file schema/registry-index-v1.schema.json

  build-extensions:
    name: Build WASM Components
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-wasip2

      - name: Build all extensions
        run: cargo build --workspace --target wasm32-wasip2 --release

      - name: Report binary sizes
        run: |
          echo "### WebAssembly Component Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for wasm in target/wasm32-wasip2/release/*.wasm; do
            if [ -f "$wasm" ]; then
              size=$(ls -lh "$wasm" | awk '{print $5}')
              name=$(basename "$wasm")
              echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  supply-chain:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiki-e/install-action@b7ec081b7e452a321943c260381fa6d01309d43d # v2
      - run: timeout 5m cargo deny check bans licenses sources
