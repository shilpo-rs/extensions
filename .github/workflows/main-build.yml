name: Main Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.json'
      - 'schema/**'
      - '*.md'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build Packages & Canonical Index
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-wasip2

      - name: Build all extensions
        run: cargo build --workspace --target wasm32-wasip2 --release

      - name: Pack extension archives
        run: |
          cargo run --manifest-path crates/generator/Cargo.toml -- pack \
            --extensions-dir extensions \
            --target-dir target/wasm32-wasip2/release \
            --output-dir dist

      - name: Build canonical unsigned index
        run: |
          cargo run --manifest-path crates/generator/Cargo.toml -- build-index \
            --extensions-dir extensions \
            --dist-dir dist \
            --owners-file owners.toml \
            --previous-index index.json \
            --output dist/unsigned-index.json \
            --commit-timestamp "${{ github.event.head_commit.timestamp }}"

      - name: Write build provenance
        run: |
          cat << PROV > dist/provenance.json
          {
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          PROV

      - name: Upload build artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99baeddf # v4.6.1
        with:
          name: registry-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
