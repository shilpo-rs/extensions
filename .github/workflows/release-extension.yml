name: Release Extension

# Reusable workflow: the actual build -> sign -> publish logic for exactly one extension,
# called by each extension's own thin trigger file (e.g. release-org.shilpo.weather.yml).
# Keeping this in one place means a fix here (like the find_wasm_binary bug this replaced)
# applies to every extension at once, rather than needing to be copied into N trigger files.
on:
  workflow_call:
    inputs:
      extension_id:
        description: Directory name under extensions/ (e.g. org.shilpo.weather)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.extension_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Pack (${{ inputs.extension_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-wasip2

      - name: Resolve Cargo package name for this extension
        id: crate
        run: |
          TOML="extensions/${{ inputs.extension_id }}/Cargo.toml"
          if [ ! -f "$TOML" ]; then
            echo "::error::no Cargo.toml at $TOML — non-Rust extensions have no build path here yet (see pending-ci-support/)"
            exit 1
          fi
          NAME=$(grep -m1 '^name *= *"' "$TOML" | cut -d '"' -f2)
          if [ -z "$NAME" ]; then
            echo "::error::could not read [package].name from $TOML"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build this extension only
        run: cargo build -p "${{ steps.crate.outputs.name }}" --target wasm32-wasip2 --release

      - name: Pack this extension's archive
        run: |
          cargo run --manifest-path crates/generator/Cargo.toml -- pack \
            --extensions-dir extensions \
            --target-dir target/wasm32-wasip2/release \
            --output-dir dist \
            --only "${{ inputs.extension_id }}"

      - name: Fetch the current signed index from main
        # The tag this workflow builds from may be older than main's tip if other
        # extensions have released since — main may already have merged more releases
        # into index.json than existed when this tag was created. Always merge against
        # main's current index, never whatever this checkout's own ref happens to have.
        # Tolerates index.json not existing yet (the very first release).
        run: |
          git fetch --depth=1 origin main
          git show origin/main:index.json > index.json 2>/dev/null || rm -f index.json

      - name: Merge this extension's release into the canonical unsigned index
        run: |
          cargo run --manifest-path crates/generator/Cargo.toml -- build-index \
            --extensions-dir extensions \
            --dist-dir dist \
            --owners-file owners.toml \
            --previous-index index.json \
            --output dist/unsigned-index.json \
            --only "${{ inputs.extension_id }}" \
            --commit-timestamp "${{ github.event.head_commit.timestamp }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-dist-${{ inputs.extension_id }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Sign & Publish (${{ inputs.extension_id }})
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist-${{ inputs.extension_id }}
          path: dist/

      - name: Set up Rust toolchain
        run: rustup show

      - name: Sign package and merge signed index
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          cargo run --manifest-path crates/generator/Cargo.toml -- sign \
            --unsigned-index dist/unsigned-index.json \
            --dist-dir dist \
            --output index.json

      - name: Upload GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          ID="${{ inputs.extension_id }}"
          PKG=$(find dist -maxdepth 1 -name "${ID}-*.shilpo-ext" | head -1)
          SIG="${PKG}.sig.json"
          if [ -z "$PKG" ] || [ ! -f "$PKG" ]; then
            echo "::error::no packed archive for $ID found in dist/"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating GitHub Release $TAG..."
            gh release create "$TAG" "$PKG" "$SIG" \
              --title "$TAG" \
              --notes "Automated release of $ID" \
              --target main
          else
            echo "Release $TAG already exists, skipping upload."
          fi

      - name: Commit and push signed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json schema/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update registry index for ${{ inputs.extension_id }} [skip ci]"
            git push origin main
          else
            echo "No index changes to commit."
          fi
