# Shilpo Extension Registry Namespace Ownership
# Maps extension ID namespace prefixes to authorized GitHub login usernames.
#
# Namespace policy:
# - "org.shilpo": Reserved for official Shilpo maintainers.
# - "io.github.<login>": Community namespaces bound to the submitter's GitHub login.
#
# Note: Changes to this file require maintainer CODEOWNERS approval.

[namespaces]
"org.shilpo" = ["sayeed205"]

# io.github.<login> namespaces are not pre-registered here — the generator derives ownership
# for those directly from the ID's <login> segment matching the submitting PR author (see
# owners.rs verify_ownership, branch 3). world-clock (io.github.sayeed205.world-clock) is an
# example of this path and needs no entry of its own.
